version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: extract-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extract_db
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: extract-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for document storage
  minio:
    image: minio/minio:latest
    container_name: extract-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: extract-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/extract_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      # LlamaExtract (Primary)
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-auto}
      # NuExtract (Fallback)
      NUMIND_API_KEY: ${NUMIND_API_KEY:-}
      NUEXTRACT_USE_LOCAL: ${NUEXTRACT_USE_LOCAL:-false}
      NUEXTRACT_MODEL: ${NUEXTRACT_MODEL:-numind/NuExtract-1.5}
      NUEXTRACT_DEVICE: ${NUEXTRACT_DEVICE:-cuda}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: extract-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/extract_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      # LlamaExtract (Primary)
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-auto}
      # NuExtract (Fallback)
      NUMIND_API_KEY: ${NUMIND_API_KEY:-}
      NUEXTRACT_USE_LOCAL: ${NUEXTRACT_USE_LOCAL:-false}
      NUEXTRACT_MODEL: ${NUEXTRACT_MODEL:-numind/NuExtract-1.5}
      NUEXTRACT_DEVICE: ${NUEXTRACT_DEVICE:-cuda}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: extract-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
